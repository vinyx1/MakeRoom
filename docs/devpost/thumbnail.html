<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>MakeRoom thumbnail</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet" />
<style>
  /* Devpost thumbnail: 3:2, rendered at 1200×800. The brand orange (--brand, #d9480f); the text is all large, so white on it reads well. */
  html, body { margin: 0; }
  html { scrollbar-width: none; }
  body { width: 1200px; height: 800px; background: #d9480f; font-family: 'IBM Plex Sans', sans-serif; color: #fff; display: flex; flex-direction: column; justify-content: center; padding: 0 120px; box-sizing: border-box; gap: 60px; }
  .brand { display: flex; align-items: center; gap: 28px; }
  .brand h1 { margin: 0; font-size: 112px; line-height: 1; font-weight: 600; letter-spacing: -0.02em; }
  .lanes { display: grid; gap: 18px; }
  .lane { position: relative; height: 44px; border-radius: 10px; background: rgb(255 255 255 / 0.12); }
  .bar { position: absolute; top: 0; height: 44px; border-radius: 10px; box-sizing: border-box; }
  .out { background: #fff; }
  .booked { background: rgb(255 255 255 / 0.35); }
  .moved { border: 3px dashed #fff; background: rgb(255 255 255 / 0.12); }
  p { margin: 0; font-size: 40px; line-height: 1.3; color: rgb(255 255 255 / 0.85); }
  p b { color: #fff; font-weight: 600; }
</style>
</head>
<body>
  <div class="brand">
    <svg width="116" height="116" viewBox="0 0 20 20" aria-hidden="true"><rect x="1" y="2" width="11" height="4" rx="1.5" fill="#fff" /><rect x="8" y="8" width="11" height="4" rx="1.5" fill="#1d1f22" /><rect x="1" y="14" width="11" height="4" rx="1.5" fill="#fff" /></svg>
    <h1>MakeRoom</h1>
  </div>
  <div class="lanes" aria-hidden="true">
    <div class="lane"><div class="bar out" style="left: 0; width: 46%"></div><div class="bar moved" style="left: 47%; width: 15%"></div><div class="bar booked" style="left: 66%; width: 34%"></div></div>
    <div class="lane"><div class="bar booked" style="left: 12%; width: 30%"></div><div class="bar booked" style="left: 58%; width: 30%"></div></div>
  </div>
  <p><b>When a rental runs late, make room.</b> An AI agent that reschedules, asks customers and holds payment with PayPal.</p>
</body>
</html>
