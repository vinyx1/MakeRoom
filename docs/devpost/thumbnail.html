<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>MakeRoom thumbnail</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet" />
<style>
  /* Devpost thumbnail: 3:2, rendered at 1200×800. */
  html, body { margin: 0; }
  html { scrollbar-width: none; }
  body { width: 1200px; height: 800px; background: #eceef1; font-family: 'IBM Plex Sans', sans-serif; color: #17191c; display: flex; align-items: center; justify-content: center; }
  .sheet { width: 1104px; height: 704px; background: #fff; border: 1px solid #dcdfe4; border-radius: 28px; display: flex; flex-direction: column; justify-content: center; padding: 0 96px; box-sizing: border-box; gap: 56px; }
  .brand { display: flex; align-items: center; gap: 28px; }
  .brand h1 { margin: 0; font-size: 104px; line-height: 1; font-weight: 600; letter-spacing: -0.02em; }
  .lanes { display: grid; gap: 18px; }
  .lane { position: relative; height: 44px; border-radius: 10px; background: #f6f7f8; }
  .bar { position: absolute; top: 0; height: 44px; border-radius: 10px; }
  .booked { background: #e2e8f1; border-left: 8px solid #4a6fa5; box-sizing: border-box; }
  .out { background: #4a6fa5; }
  .moved { background: #fcebe3; border: 3px dashed #d9480f; box-sizing: border-box; }
  p { margin: 0; font-size: 40px; line-height: 1.3; color: #5a6068; }
  p b { color: #17191c; font-weight: 600; }
</style>
</head>
<body>
  <div class="sheet">
    <div class="brand">
      <svg width="112" height="112" viewBox="0 0 20 20" aria-hidden="true"><rect x="1" y="2" width="11" height="4" rx="1.5" fill="#1d1f22" /><rect x="8" y="8" width="11" height="4" rx="1.5" fill="#d9480f" /><rect x="1" y="14" width="11" height="4" rx="1.5" fill="#1d1f22" /></svg>
      <h1>MakeRoom</h1>
    </div>
    <div class="lanes" aria-hidden="true">
      <div class="lane"><div class="bar out" style="left: 0; width: 46%"></div><div class="bar moved" style="left: 47%; width: 15%"></div><div class="bar booked" style="left: 66%; width: 34%"></div></div>
      <div class="lane"><div class="bar booked" style="left: 12%; width: 30%"></div><div class="bar booked" style="left: 58%; width: 30%"></div></div>
    </div>
    <p><b>When a rental runs late, make room.</b> An AI agent that reschedules, asks customers and holds payment with PayPal.</p>
  </div>
</body>
</html>
